<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NBA Seasons Generator</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div
      class="container vh-100 d-flex align-items-center justify-content-center"
    >
      <div class="nba-card text-center col-12 col-md-8 col-lg-6">
        <div class="container my-4">
          <div class="row text-center align-items-center">
            <div class="col">
              <img
                src="images/Untitled design (2).png"
                class="img-fluid img-west"
              />
            </div>
            <div class="col">
              <img
                src="images/Untitled design (1).png"
                class="img-fluid nba-img"
              />
            </div>
            <div class="col">
              <img
                src="images/Untitled design (3).png"
                class="img-fluid img-east"
              />
            </div>
          </div>
        </div>

        <div class="d-grid gap-3">
          <button id="btn-2022" class="btn btn-22 btn-lg">2022</button>
          <button id="btn-2023" class="btn btn-23 btn-lg">2023</button>
          <button id="btn-2024" class="btn btn-24 btn-lg">2024</button>
          <button id="btn-2025" class="btn btn-25 btn-lg">2025</button>
          <button id="btn-2026" class="btn btn-26 btn-lg">2026</button>
        </div>

        <ul class="list-group standings-list mt-4"></ul>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/script.js"></script>
  </body>
</html>
